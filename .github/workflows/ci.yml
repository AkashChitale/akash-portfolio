name: Portfolio checks and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL || (github.event_name == 'pull_request' && 'https://akashchitale.dev') || '' }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/deployment-config.mjs site
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-portfolio-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
  deploy:
    needs: check
    if: >-
      github.repository == 'AkashChitale/akash-portfolio' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: dist/
          digest-mismatch: error
          merge-multiple: true
      - name: Validate configuration and current main
        id: config
        run: node scripts/deployment-config.mjs production
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check downloaded production artifact
        run: node scripts/deploy-s3.mjs --check
      - name: Check AWS CLI
        run: aws --version
      - name: Assume deployment role using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: portfolio-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ steps.config.outputs.account-id }}
          unset-current-credentials: true
          translate-env-variables: false
          action-timeout-s: 120
      - name: Sync and verify production
        run: node scripts/deploy-s3.mjs
